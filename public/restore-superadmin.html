<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restore Superadmin Role</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-top: 0;
    }
    p {
      color: #666;
      line-height: 1.6;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
      margin-top: 20px;
    }
    button:hover {
      background: #5568d3;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      font-size: 14px;
      display: none;
    }
    .status.loading {
      background: #e3f2fd;
      color: #1976d2;
      display: block;
    }
    .status.success {
      background: #c8e6c9;
      color: #2e7d32;
      display: block;
    }
    .status.error {
      background: #ffcdd2;
      color: #c62828;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Restore Superadmin Role</h1>
    <p>This tool will restore your superadmin role after a password reset.</p>
    <p><strong>Note:</strong> You must be logged in as dragomirvaleriu@gmail.com</p>
    <button id="restoreBtn" onclick="restoreRole()">Restore Superadmin Role</button>
    <div id="status" class="status"></div>
  </div>

  <script type="module">
    // Import Firebase modules
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBvHZLXBLEhTNHr5zNNW8iDL-W1aPBYA6I",
      authDomain: "mygarden-hq.firebaseapp.com",
      projectId: "mygarden-hq",
      storageBucket: "mygarden-hq.appspot.com",
      messagingSenderId: "718151652005",
      appId: "1:718151652005:web:2f0d7de09a38e0a11e123f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const functions = getFunctions(app);

    window.restoreRole = async function() {
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('restoreBtn');

      try {
        const user = auth.currentUser;
        if (!user) {
          showStatus('Please log in first', 'error');
          return;
        }

        if (user.email !== 'dragomirvaleriu@gmail.com') {
          showStatus('Only dragomirvaleriu@gmail.com can restore superadmin role', 'error');
          return;
        }

        showStatus('Restoring superadmin role...', 'loading');
        btn.disabled = true;

        const restoreSuperAdminRole = httpsCallable(functions, 'restoreSuperAdminRole');
        const result = await restoreSuperAdminRole({});

        showStatus('✅ Superadmin role restored successfully!', 'success');
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      } catch (err) {
        console.error('Error:', err);
        showStatus(`Error: ${err.message || 'Failed to restore role'}`, 'error');
        btn.disabled = false;
      }
    };

    function showStatus(message, type) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
    }
  </script>
</body>
</html>
